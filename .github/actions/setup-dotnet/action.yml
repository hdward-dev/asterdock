name: Set up .NET
description: Install the .NET SDK pinned by AsterDock CI. Check out the repository before this action; a local action is not on the runner until checkout.

inputs:
  dotnet-version:
    description: SDK version
    required: false
    default: "10.0.400"

runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
