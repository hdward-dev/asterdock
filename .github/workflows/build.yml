name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Restore dependencies
        run: dotnet restore AsterDock.slnx

      - name: Check application catalog generation
        run: python -m unittest discover -s tests -p test_app_catalog.py

      - name: Check update versions and installer downloads
        run: dotnet run --project tests/Update.Checks --configuration Release

      - name: Build solution
        run: dotnet build AsterDock.slnx --configuration Release --no-restore

  local-desktop:
    name: Check embedded RDP and VNC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - name: Install FreeRDP development libraries
        timeout-minutes: 20
        run: |
          apt_opts=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get update "${apt_opts[@]}" \
              && sudo timeout 180 apt-get install -y "${apt_opts[@]}" cmake pkg-config freerdp3-dev libwinpr3-dev; then
              exit 0
            fi
            echo "FreeRDP apt install failed (attempt ${attempt}/3)" >&2
            if [[ "${attempt}" -eq 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Build native RDP bridge
        run: bash scripts/build-uremote-rdp.sh
      - name: Check VNC protocol and RDP native lifecycle
        run: dotnet run --project tests/URemote.LocalChecks --configuration Release -- --require-rdp
