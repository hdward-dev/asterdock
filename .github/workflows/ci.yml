# Pull request and main CI. This workflow does not publish GitHub Releases.
#
# Other checks on the same main / pull_request triggers:
#   portal-checks.yml   Portal and PipeWire protocol
#   uremote-macos.yml   macOS desktop bridge; also called while packaging
#   vmcube-native.yml   SPICE/QEMU natives, path-filtered; also called while packaging
#
# Publishing lives in release.yml (Nightly and formal tags) and package-release.yml.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore dependencies
        run: dotnet restore AsterDock.slnx

      - name: Check application catalog generation
        run: python -m unittest discover -s tests -p test_app_catalog.py

      - name: Check update versions and installer downloads
        run: dotnet run --project tests/Update.Checks --configuration Release

      - name: Build solution
        run: dotnet build AsterDock.slnx --configuration Release --no-restore

      - name: Check isolated file sharing runtime and HTTP lifecycle
        run: dotnet run --project tests/FileShare.Checks --configuration Release --no-build

      - name: Check Invoice Printer packaging keeps PDFium
        shell: pwsh
        run: |
          ./tests/test-appbundle-assets.ps1
          ./scripts/package-apps.ps1 -Name invoice-printer -OutputDirectory artifacts/invoice-printer-check
          ./tests/test-appbundle-assets.ps1 -Bundle artifacts/invoice-printer-check/AsterDock-App-invoice-printer.appbundle

  release-resolver:
    name: Check Nightly and stable tag rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve sample releases
        run: bash tests/test_resolve_release.sh

  local-desktop:
    name: Check embedded RDP and VNC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install FreeRDP development libraries
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: cmake pkg-config freerdp3-dev libwinpr3-dev

      - name: Build native RDP bridge
        run: bash scripts/build-uremote-rdp.sh

      - name: Check VNC protocol and RDP native lifecycle
        run: dotnet run --project tests/URemote.LocalChecks --configuration Release -- --require-rdp
