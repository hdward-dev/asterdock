name: Linux Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-linux:
    name: Build Linux (${{ matrix.rid }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rid:
          - linux-x64
          - linux-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libgl1 libxkbcommon-x13 libwayland-client0 libwayland-cursor0 libwayland-egl1 libxdamage1 libxrandr2 libxss1 libasound2 libatk1.0-0 libatk-bridge2.0-0 libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libicu70 libgbm1

      - name: Restore dependencies
        run: dotnet restore AsterDock.slnx --runtime ${{ matrix.rid }}

      - name: Build solution
        run: dotnet build AsterDock.slnx --configuration Release --no-restore -p:RuntimeIdentifier=${{ matrix.rid }}

      - name: Publish self-contained
        run: dotnet publish src/AsterDock.Host/AsterDock.Host.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:BundleApplications=false -o artifacts/publish/${{ matrix.rid }}

      - name: Package Linux release
        run: bash scripts/package-linux.sh ${{ matrix.rid }} artifacts/release/${{ matrix.rid }}

      - name: Upload Linux packages
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/${{ matrix.rid }}/*
          if-no-files-found: error
