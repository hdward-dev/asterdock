# Release entry. 发布入口：Nightly 与正式版共用本文件。
#
# Do not rename this file and do not move the schedule to another workflow.
# Nightly versions are 1.0.<github.run_number> of THIS file. A new filename
# starts the counter at 1, which is older than the shipped 1.0.69 line, and
# clients ignore an update whose numeric prefix is not newer.
#
# Nightly（定时 / 手动）:
#   schedule 14:00 UTC, or workflow_dispatch.
#   Tag: v1.0.<run>-nightly-<YYYYMMDD>-<sha>
#   The schedule publishes only when the latest commit's Asia/Shanghai date
#   is today. workflow_dispatch publishes anyway (manual catch-up).
#   Automation often receives 403 on workflow_dispatch; the schedule is the
#   reliable Nightly path. Dispatch is always Nightly, even if the ref is a tag.
#
# Formal（正式版本）:
#   Push a clean tag vMAJOR.MINOR.PATCH. Example:
#     git tag v1.2.3 && git push origin v1.2.3
#   Suffixes such as -nightly- or -rc1 do not match, so creating a Nightly
#   release cannot start this path again.
#   Optional body: .github/release-notes/vX.Y.Z.md on the tagged commit.
#   Without that file the body is the installer list.
#
# Both channels are marked Latest. They share one concurrency group so two
# publishes cannot race. The job graph and artifact names are in
# package-release.yml. Clients keep the v1.0.69 download names.

name: Release

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
  push:
    tags:
      # Full-string semver only. Nightly tags such as v1.0.68-nightly-… must not match,
      # or creating a nightly release would start this workflow again.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "!v*-nightly-*"

permissions:
  contents: write

concurrency:
  group: astordock-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ github.event_name == 'push' && 'stable' || 'Nightly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      release_date: ${{ steps.release.outputs.release_date }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve channel, tag, and version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/resolve-release.sh

  package:
    name: Package and publish (${{ needs.prepare.outputs.channel }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/package-release.yml
    with:
      channel: ${{ needs.prepare.outputs.channel }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      release_date: ${{ needs.prepare.outputs.release_date }}
    secrets: inherit
