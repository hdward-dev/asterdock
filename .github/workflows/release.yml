name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  macos:
    name: Package (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Package macOS arm64
        run: bash scripts/package-macos.sh osx-arm64

      - name: Archive macOS arm64 app
        run: |
          cd artifacts/macos/osx-arm64
          zip -qry "${{ github.workspace }}/artifacts/AsterDock-macos-arm64.zip" 星栈.app

      - name: Package macOS x64
        run: bash scripts/package-macos.sh osx-x64

      - name: Archive macOS x64 app
        run: |
          cd artifacts/macos/osx-x64
          zip -qry "${{ github.workspace }}/artifacts/AsterDock-macos-x64.zip" 星栈.app

      - name: Package invoice printer app bundle
        run: |
          bash scripts/package-invoice-app.sh
          cp artifacts/apps/InvoicePrinter.appbundle artifacts/InvoicePrinter.appbundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: |
            artifacts/AsterDock-macos-arm64.zip
            artifacts/AsterDock-macos-x64.zip
            artifacts/InvoicePrinter.appbundle
          if-no-files-found: error

  windows:
    name: Package (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Publish Windows x64
        run: dotnet publish src/AsterDock.Host/AsterDock.Host.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish/win-x64

      - name: Archive Windows build
        run: Compress-Archive -Path artifacts/publish/win-x64/* -DestinationPath artifacts/AsterDock-win-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: artifacts/AsterDock-win-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "AsterDock ${{ github.ref_name }}" \
            --generate-notes \
            dist/*
