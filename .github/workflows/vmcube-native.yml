# VMCUBE SPICE helper and optional QEMU engine.
#
# CI: main pushes and pull requests that touch the paths below.
# Packaging: release.yml → package-release.yml calls this with workflow_call,
# which ignores the path filters and builds every runtime below.
#
# Each job uploads vmcube-native-<rid>. package-release.yml stages those
# directories and scripts/package-apps.ps1 splits out VMCUBE-QEMU-<rid>.zip.
# Do not rename the artifact.

name: VMCUBE native checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/VMCube.Module/**"
      - "tests/VMCube.Checks/**"
      - "scripts/*vmcube*"
      - ".github/workflows/vmcube-native.yml"
      - ".github/actions/**"
  push:
    branches:
      - main
    paths:
      - "src/VMCube.Module/**"
      - "tests/VMCube.Checks/**"
      - "scripts/*vmcube*"
      - ".github/workflows/vmcube-native.yml"
      - ".github/actions/**"
  workflow_call:
  workflow_dispatch:

# Hardcoded prefix so a Release workflow_call does not share a group with
# VMCUBE CI or with the macOS bridge call in the same release.
concurrency:
  group: vmcube-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  native:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, rid: linux-x64}
          - {runner: ubuntu-24.04-arm, rid: linux-arm64}
          - {runner: macos-15-intel, rid: osx-x64}
          - {runner: macos-15, rid: osx-arm64}
          - {runner: windows-latest, rid: win-x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out and set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Check packaging path resolution
        run: python -m unittest discover -s tests -p test_vmcube_bundle_paths.py

      - name: Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: cmake pkg-config patchelf libspice-client-glib-2.0-dev qemu-system-x86 qemu-utils xvfb

      - name: macOS dependencies
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: brew install cmake pkgconf spice-gtk qemu

      - name: Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        timeout-minutes: 30
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-spice-gtk mingw-w64-ucrt-x86_64-gobject-introspection mingw-w64-ucrt-x86_64-qemu

      - name: Verify signed macOS relocation
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s tests -p test_vmcube_macos_bundle.py

      - name: Build and stage native components
        if: runner.os != 'Windows'
        run: bash scripts/build-vmcube-native.sh

      - name: Build Windows native components
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-vmcube-native.sh

      - name: Check local VM and SPICE protocol with QEMU
        if: runner.os == 'Linux'
        run: dotnet run --project tests/VMCube.Checks -c Release -- --spice-helper src/VMCube.Module/Native/bin/${{ matrix.rid }}/vmcube-spice --qemu src/VMCube.Module/Native/bin/${{ matrix.rid }}/qemu/qemu-system-x86_64

      - name: Check actual Avalonia interface
        if: runner.os == 'Linux'
        run: xvfb-run -a dotnet run --project tests/VMCube.UiChecks -c Release -- /tmp/vmcube-ui --console-qemu src/VMCube.Module/Native/bin/${{ matrix.rid }}/qemu/qemu-system-x86_64

      - name: Build managed application
        run: dotnet build src/VMCube.Module -c Release

      - name: Upload native components
        uses: actions/upload-artifact@v6
        with:
          name: vmcube-native-${{ matrix.rid }}
          path: src/VMCube.Module/Native/bin/${{ matrix.rid }}/**
          if-no-files-found: error
