<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>请输入访问口令</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 background:#f6f7f9;color:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){
  body{background:#0f1115;color:#e6e9ee}
  .box{background:#161a21 !important;border-color:#262c36 !important}
  input{background:#0f1115 !important;color:#e6e9ee !important;border-color:#262c36 !important}
  p{color:#9aa3b2 !important}
}
.box{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:36px 32px;width:340px;
 box-shadow:0 4px 24px rgba(0,0,0,.07);text-align:center}
.icon{font-size:34px;margin-bottom:10px}
h1{font-size:17px;margin:0 0 6px;font-weight:650}
p{color:#6b7280;font-size:13px;margin:0 0 20px}
input{width:100%;padding:11px 13px;border:1px solid #e5e7eb;border-radius:9px;font-size:14px;
 font-family:inherit;outline:none;margin-bottom:12px;text-align:center;letter-spacing:1px}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #eff6ff}
button{width:100%;padding:11px;border:none;border-radius:9px;background:#2563eb;color:#fff;
 font-size:14px;cursor:pointer;font-family:inherit;font-weight:500}
button:hover{filter:brightness(1.08)}
.err{color:#dc2626;font-size:12.5px;margin-bottom:12px}
</style></head>
<body><div class="box">
 <div class="icon">&#128274;</div>
 <h1>需要访问口令</h1>
 <p>该分享目录已设置密码保护</p>
 __ERROR__
 <form method="post" action="/__auth">
   <input type="password" name="token" placeholder="请输入口令" autofocus autocomplete="current-password">
   <button type="submit">进入</button>
 </form>
</div></body></html>
